# Publishes the sandbox's image to GitHub's registry (ghcr.io/falkenslab/moodle-sandbox) when a
# version tag is created: v<Moodle version>, with a -N suffix when the sandbox changes without
# changing Moodle (v5.2.4, v5.2.4-2). For amd64 and arm64 (Apple silicon Macs).
#
# The image's tags, for the tag v5.2.4-2:
#   5.2.4-2  this exact build
#   5.2.4    the latest build of that Moodle (the one docker-compose.yml uses)
#   5.2      the latest of the 5.2 series
name: Image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (v5.2.4, v5.2.4-2...); it must exist in the repository"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Versions from the tag
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          full="${TAG#v}"                 # 5.2.4-2
          moodle="${full%%-*}"            # 5.2.4
          series="${moodle%.*}"           # 5.2
          if ! [[ "$moodle" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The tag \"$TAG\" is neither v<x.y.z> nor v<x.y.z>-<n>." >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/moodle-sandbox"
          tags="$image:$moodle,$image:$series"
          # With a suffix, the exact tag too (without one, it would be the same as Moodle's).
          [ "$full" != "$moodle" ] && tags="$image:$full,$tags"
          {
            echo "ref=$TAG"
            echo "moodle=v$moodle"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.ref }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # SANDBOX_BUILD marks the image as published: `up` updates it (see Dockerfile).
          build-args: |
            MOODLE_VERSION=${{ steps.version.outputs.moodle }}
            SANDBOX_BUILD=${{ steps.version.outputs.ref }}
          tags: ${{ steps.version.outputs.tags }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
