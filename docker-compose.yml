# Nombre del proyecto: no depende de cómo se llame la carpeta del clon. Una segunda
# instancia (otra versión de Moodle, en otro clon) lleva otro en MOODLE_SANDBOX_NAME (.env).
name: ${MOODLE_SANDBOX_NAME:-moodle-sandbox}

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      - POSTGRES_USER=moodle
      - POSTGRES_PASSWORD=${MOODLE_DB_PASSWORD}
      - POSTGRES_DB=moodle
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodle"]
      interval: 5s
      timeout: 5s
      retries: 20

  webserver:
    image: moodlehq/moodle-php-apache:8.3-bullseye
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # MOODLE_SANDBOX_PORT se puede fijar en .env si el 8080 ya está ocupado.
      - "${MOODLE_SANDBOX_PORT:-8080}:80"
    environment:
      # Moodle 5.1+ sirve la web desde public/; hasta 5.0, desde la raíz. manage.mjs lo
      # deduce del código clonado (MOODLE_DOCROOT).
      - APACHE_DOCUMENT_ROOT=${MOODLE_DOCROOT:-/var/www/html/public}
    volumes:
      - ./src:/var/www/html
      - moodledata_data:/var/www/moodledata

volumes:
  db_data:
  moodledata_data:
