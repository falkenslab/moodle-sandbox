# A fixed project name: the containers and volumes don't depend on the name of the clone's
# folder. Another name (MOODLE_SANDBOX_PROJECT) is another site, with its own volumes: that's how
# the Moodle 5.2 and the 4.5 sites live side by side (manage.mjs --moodle 4.5).
name: ${MOODLE_SANDBOX_PROJECT:-moodle-sandbox}

# The sandbox's image (Dockerfile): Moodle with its code inside. The webserver and the cron share
# it. Its tag is the Moodle version it carries (MOODLE_VERSION): `up` pulls it from GitHub if it's
# published and, if not (or offline), builds it here with the Dockerfile.
x-moodle: &moodle
  build:
    context: .
    args:
      MOODLE_VERSION: v${MOODLE_VERSION:-5.2.4}
  image: ghcr.io/falkenslab/moodle-sandbox:${MOODLE_VERSION:-5.2.4}
  pull_policy: missing
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  # No APACHE_DOCUMENT_ROOT: the base image serves /var/www/html/public if it exists (Moodle 5.1
  # and later) and /var/www/html if not (4.5).
  environment:
    # What config.php reads from the environment (docker/config.php).
    - MOODLE_DB_PASSWORD=${MOODLE_DB_PASSWORD}
    - MOODLE_WWWROOT=${MOODLE_SANDBOX_URL:-http://localhost:${MOODLE_SANDBOX_PORT:-8080}}
  volumes:
    - moodledata_data:/var/www/moodledata
  # H5P's Hub, pointing nowhere: mod_hvp registers the site with it when installed, and a sandbox
  # doesn't talk to outside services (see docker/config.php).
  extra_hosts:
    - "hub-api.h5p.org:127.0.0.1"
    - "h5p.org:127.0.0.1"

services:
  db:
    image: postgres:17
    restart: unless-stopped
    # A disposable sandbox: without waiting for every write to reach the disk, writes are much
    # faster. In exchange, a power cut or a hard Docker stop can leave the database unusable
    # (rebuilt with `npm run reset -- --yes` and `setup`).
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off", "-c", "shared_buffers=256MB"]
    environment:
      - POSTGRES_USER=moodle
      - POSTGRES_PASSWORD=${MOODLE_DB_PASSWORD}
      - POSTGRES_DB=moodle
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodle"]
      interval: 5s
      timeout: 5s
      retries: 20

  webserver:
    <<: *moodle
    ports:
      # MOODLE_SANDBOX_PORT can be set in .env if 8080 is already taken.
      - "${MOODLE_SANDBOX_PORT:-8080}:80"

  # Moodle's cron, every minute, as on a real site: it runs the scheduled and the ad hoc tasks
  # (backups and course copies, restores, sending notifications...).
  cron:
    <<: *moodle
    entrypoint: ["bash", "-c", "while true; do php /var/www/html/admin/cli/cron.php; sleep 60; done"]

  # Jobe, the server where CodeRunner runs the answers' code against their test cases
  # (http://jobe, set by manage.mjs). No port on the machine: only Moodle uses it. Pinned by its
  # digest (it only publishes "latest"); amd64 only, emulated on Apple silicon Macs.
  jobe:
    image: trampgeek/jobeinabox@sha256:b442c8e63f016ff33aa2b6f28c36abc8ebd30cbb39e8e025cadeec2107c5ce85
    restart: unless-stopped
    # The image's health check, every 5 s instead of every minute: `up` waits for Jobe to answer,
    # and until the first check it isn't known.
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/python3 /var/www/html/jobe/minimaltest.py || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
  moodledata_data:
