# Nombre fijo del proyecto: los contenedores y volúmenes no dependen de cómo se llame
# la carpeta del clon. Otro nombre (MOODLE_SANDBOX_PROJECT) es otro sitio, con sus propios
# volúmenes: así conviven el de Moodle 5.2 y el de 4.5 (manage.mjs --moodle 4.5).
name: ${MOODLE_SANDBOX_PROJECT:-moodle-sandbox}

# La imagen del sandbox (Dockerfile): Moodle con su código dentro. El webserver y el cron la
# comparten. Su etiqueta es la versión de Moodle que lleva (MOODLE_VERSION): `up` la descarga
# de GitHub si está publicada y, si no (o sin conexión), la construye aquí con el Dockerfile.
x-moodle: &moodle
  build:
    context: .
    args:
      MOODLE_VERSION: v${MOODLE_VERSION:-5.2.4}
  image: ghcr.io/falkenslab/moodle-sandbox:${MOODLE_VERSION:-5.2.4}
  pull_policy: missing
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  # Sin APACHE_DOCUMENT_ROOT: la imagen base sirve /var/www/html/public si existe (Moodle 5.1 y
  # siguientes) y /var/www/html si no (4.5).
  environment:
    # Lo que config.php lee del entorno (docker/config.php).
    - MOODLE_DB_PASSWORD=${MOODLE_DB_PASSWORD}
    - MOODLE_WWWROOT=${MOODLE_SANDBOX_URL:-http://localhost:${MOODLE_SANDBOX_PORT:-8080}}
  volumes:
    - moodledata_data:/var/www/moodledata
  # El Hub de H5P, a ninguna parte: mod_hvp registra el sitio en él al instalarse, y un sandbox no
  # habla con servicios de fuera (ver docker/config.php).
  extra_hosts:
    - "hub-api.h5p.org:127.0.0.1"
    - "h5p.org:127.0.0.1"

services:
  db:
    image: postgres:17
    restart: unless-stopped
    # Un sandbox desechable: sin esperar a que cada escritura llegue al disco, las escrituras
    # van mucho más rápidas. A cambio, un corte de luz o un apagado brusco de Docker puede
    # dejar la base de datos inservible (se rehace con `npm run reset -- --yes` y `setup`).
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off", "-c", "shared_buffers=256MB"]
    environment:
      - POSTGRES_USER=moodle
      - POSTGRES_PASSWORD=${MOODLE_DB_PASSWORD}
      - POSTGRES_DB=moodle
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodle"]
      interval: 5s
      timeout: 5s
      retries: 20

  webserver:
    <<: *moodle
    ports:
      # MOODLE_SANDBOX_PORT se puede fijar en .env si el 8080 ya está ocupado.
      - "${MOODLE_SANDBOX_PORT:-8080}:80"

  # El cron de Moodle, cada minuto, como en un sitio de verdad: ejecuta las tareas programadas
  # y las ad hoc (copias de seguridad y de cursos, restauraciones, envío de notificaciones…).
  cron:
    <<: *moodle
    entrypoint: ["bash", "-c", "while true; do php /var/www/html/admin/cli/cron.php; sleep 60; done"]

  # Jobe, el servidor donde CodeRunner ejecuta el código de las respuestas contra sus casos de
  # prueba (http://jobe, ajustado por manage.mjs). Sin puerto en el equipo: solo lo usa Moodle.
  # Fijado por su digest (solo publica "latest"); solo para amd64, en Mac con chip M va emulado.
  jobe:
    image: trampgeek/jobeinabox@sha256:b442c8e63f016ff33aa2b6f28c36abc8ebd30cbb39e8e025cadeec2107c5ce85
    restart: unless-stopped
    # La comprobación de la imagen, cada 5 s en vez de cada minuto: `up` espera a que Jobe
    # responda, y hasta la primera comprobación no se sabe.
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/python3 /var/www/html/jobe/minimaltest.py || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
  moodledata_data:
