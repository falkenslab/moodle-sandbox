; The sandbox's PHP settings, inside its image (see Dockerfile).
;
; Moodle 5.2 has about 58000 PHP files and the default opcache only holds 10000: it filled up and
; recompiled endlessly. Moodle's code is in the image and doesn't change while the container lives,
; so there's no need to check each file's timestamp on every request: the web server compiles each
; one only once. A new Moodle is a new image. The CLI (seeding, cron) doesn't use the opcache.
opcache.enable = 1
opcache.memory_consumption = 384
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 100000
opcache.validate_timestamps = 0

; Fewer filesystem lookups to resolve paths.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
