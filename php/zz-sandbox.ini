; Ajustes de PHP del sandbox, dentro de su imagen (ver Dockerfile).
;
; Moodle 5.2 tiene unos 58000 ficheros PHP y el opcache por defecto solo admite 10000: se llenaba
; y recompilaba sin parar. El código de Moodle está en la imagen y no cambia mientras el
; contenedor vive, así que no hace falta comprobar la fecha de cada fichero en cada petición:
; el servidor web compila cada uno una sola vez. Un Moodle nuevo es una imagen nueva. La CLI
; (sembrar, cron) no usa opcache.
opcache.enable = 1
opcache.memory_consumption = 384
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 100000
opcache.validate_timestamps = 0

; Menos consultas al sistema de ficheros para resolver rutas.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
